services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyrohost}
      POSTGRES_USER: ${POSTGRES_USER:-cyrohost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyrohost}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cyrohost_pg:/var/lib/postgresql/data

volumes:
  cyrohost_pg:
