server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: cyrohost-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyrohost}
    username: ${DB_USERNAME:cyrohost}
    password: ${DB_PASSWORD:cyrohost}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jackson:
    default-property-inclusion: non_null

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

cyro:
  auth:
    issuer: ${JWT_ISSUER:cyrohost}
    access-token-minutes: 15
    refresh-days: 1
    remember-days: 30
    reset-minutes: 30
    jwt-secret: ${JWT_SECRET:}
    cookie-secure: ${COOKIE_SECURE:false}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    expose-dev-reset-token: ${EXPOSE_DEV_RESET_TOKEN:false}
    mail-from: ${MAIL_FROM:}
    admin-emails: ${ADMIN_EMAILS:}
    admin-notification-email: ${ADMIN_NOTIFICATION_EMAIL:cyrohostsponsorship@gmail.com}
    admin-email: ${CYROHOST_ADMIN_EMAIL:}
    admin-password: ${CYROHOST_ADMIN_PASSWORD:}
    admin-upgrade-existing: ${CYROHOST_ADMIN_UPGRADE:false}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
